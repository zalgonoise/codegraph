# The payouts sample's production, as `helm template` renders it: the API and
# the send job, configured with the same database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payouts-config
data:
  DB_HOST: payouts-main.abc123.eu-west-1.rds.example.com
  DB_NAME: payouts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payouts-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: registry.example.com/payouts:v1
          command: ["/bin/api"]
          envFrom:
            - configMapRef:
                name: payouts-config
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: payouts-send
spec:
  schedule: "15 15 * * 1-5"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: send
              image: registry.example.com/payouts:v1
              command: ["/bin/send"]
              envFrom:
                - configMapRef:
                    name: payouts-config
